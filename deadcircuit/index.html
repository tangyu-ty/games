<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1019">
  <meta name="description" content="断线协议 DEAD CIRCUIT：穿过十八处独立战场的原创战术射击。拆装武器、利用掩体，在安保与感染者之间找出城市失控的真相。">
  <title>断线协议 · DEAD CIRCUIT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c1825'/%3E%3Cpath d='M8 21l15-15M7 17l8 8' stroke='%2387d1cb' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="断线协议战术行动画面"></canvas>
  <div id="screenTexture" aria-hidden="true"></div>
  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="operation-card"><span class="micro" id="hudAct">ACT 01 / 白隼城</span><strong id="hudMission">行动准备</strong><span class="mission-status"><i></i><span id="hudStage">保持通讯</span></span></div>
      <div class="hud-actions"><button id="hudJournal" class="icon-button" aria-label="任务日志，M">▤ <span>日志</span></button><button id="hudPause" class="icon-button" aria-label="暂停，Esc">Ⅱ <span>暂停</span></button></div>
    </div>
    <div class="hud-objective"><span class="micro">当前目标</span><strong id="hudObjective">抵达目标区域</strong><span id="hudObjectiveDetail"></span></div>
    <div id="hudRadio" class="radio-message" hidden><span class="micro">小队通讯</span><p></p></div>
    <div id="interactionHint" class="interaction-hint" hidden><kbd>F</kbd><span id="interactionText">互动</span><div class="interaction-track"><i id="interactionProgress"></i></div></div>
    <div class="hud-bottom">
      <div class="vitals-card"><div class="vitals-heading"><span>许砚 <em>FIELD OPERATIVE</em></span><strong id="hudHealthText">100</strong></div><div class="meter health"><i id="hudHealth"></i></div><div class="secondary-vitals"><span>护甲 <b id="hudArmorText">60</b></span><div class="meter armor"><i id="hudArmor"></i></div></div><div class="meter stamina"><i id="hudStamina"></i></div><div class="stance-line"><span id="hudStance">站立</span><span id="hudAction">待命</span></div></div>
    <div class="hud-controls" id="hudControls"><span><kbd>R</kbd> 换弹</span><span><kbd>C</kbd> 掩体</span><span><kbd>Space</kbd> 翻越 / 闪避</span><span><kbd>G</kbd> 投掷</span></div>
      <div class="weapon-card"><span class="micro" id="hudWeaponFamily">PRIMARY WEAPON</span><strong id="hudWeapon">制式步枪</strong><div class="ammo-row"><b id="hudAmmo">30</b><span>/ <span id="hudReserve">120</span></span><small id="hudFireMode">自动</small></div><div class="equipment-row"><span id="hudGrenades">投掷 3</span><span id="hudMedkits">医疗 2</span></div></div>
    </div>
  </div>
  <main id="overlay" class="overlay" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="touchControls" class="touch-controls" aria-label="触屏战术控制">
    <div class="touch-pad touch-move" id="movePad" data-stick="move" aria-label="移动摇杆"><div></div><span>移动</span></div>
    <div class="touch-pad touch-aim" id="aimPad" aria-hidden="true"><div></div><span>拖动瞄准 / 射击</span></div>
    <div class="touch-action-grid"><button data-touch="dodge" aria-label="翻越或闪避">闪避</button><button data-touch="reload" aria-label="换弹">换弹</button><button data-touch="interact" aria-label="与附近目标互动">互动</button><button data-touch="cover" aria-label="进出掩体">掩体</button><button data-touch="grenade" aria-label="投掷手雷">投掷</button><button data-touch="heal" aria-label="医疗">治疗</button><button data-touch="crouch" aria-label="蹲伏潜行">潜行</button><button data-touch="swap" aria-label="切换武器">切枪</button></div>
  </div>
  <noscript>《断线协议》需要启用 JavaScript。游戏美术、音乐与全部关卡均在本地运行。</noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
