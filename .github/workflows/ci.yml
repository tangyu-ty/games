name: Browser quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Complete browser regressions
        run: npm test
        env:
          CHROMIUM_PATH: ''
      - uses: actions/upload-artifact@v4
        with:
          name: tidekeeper-offline
          path: dist/tidekeeper.html
